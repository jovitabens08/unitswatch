{% extends "tracker/base.html" %}
{% block title %}Login — UnitsWatch{% endblock %}
{% block content %}
<div style="width:100%;max-width:420px;padding:20px;">
  <div style="text-align:center;margin-bottom:32px;">
    <div style="width:52px;height:52px;background:linear-gradient(135deg,#0D9488,#F59E0B);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px;">⚡</div>
    <div style="font-size:22px;font-weight:600;letter-spacing:-.4px;">Welcome back</div>
    <div style="font-size:13px;color:var(--muted);margin-top:4px;">Log in to your UnitsWatch account</div>
  </div>

  {% if messages %}
    {% for msg in messages %}
      <div class="alert alert-error" style="margin-bottom:14px;">{{ msg }}</div>
    {% endfor %}
  {% endif %}

  <div class="card">
    <form method="POST" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="fg">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter your username" required autofocus>
      </div>
      <div class="fg">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;">Login</button>
    </form>
  </div>

  <div style="text-align:center;margin-top:18px;font-size:13px;color:var(--muted);">
    Don't have an account? <a href="{% url 'register' %}" style="color:var(--tealL);text-decoration:none;">Register</a>
  </div>
</div>
{% endblock %}
